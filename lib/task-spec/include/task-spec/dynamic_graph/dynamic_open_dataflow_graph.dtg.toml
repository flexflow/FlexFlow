namespace = "FlexFlow"
name = "DynamicOpenDataflowGraph"
type = "struct"
features = [
  "eq",
	"ord",
  "fmt",
  "json_serialize",
]

includes = [
  "task-spec/dynamic_graph/dynamic_node_invocation.dtg.h",
  "<set>",
  "task-spec/dynamic_graph/dynamic_invocation_id_t.dtg.h",
  "task-spec/dynamic_graph/dynamic_value_attrs.dtg.h",
  "task-spec/dynamic_graph/dynamic_value_id_t.dtg.h",
  "utils/bidict/unordered_bidict.h",
]

src_includes = [
  "utils/fmt/set.h",
]

[[fields]]
name = "invocations"
type = "std::set<::FlexFlow::DynamicNodeInvocation>"

[[fields]]
name = "invocation_ids"
type = "::FlexFlow::unordered_bidict<::FlexFlow::dynamic_invocation_id_t, ::FlexFlow::DynamicNodeInvocation>"

[[fields]]
name = "value_ids"
type = "::FlexFlow::unordered_bidict<::FlexFlow::dynamic_value_id_t, ::FlexFlow::DynamicValueAttrs>"
